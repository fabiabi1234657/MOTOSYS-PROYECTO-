name: motosys-apps
services:
  core-nestjs:
    build: ../services/core-nestjs
    mem_limit: 256m
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Define REDIS_URL}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Define TOTP_ENCRYPTION_KEY}
      PASSWORD_DENYLIST: ${PASSWORD_DENYLIST:-}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:-http://notify-java:3001/internal/notifications/events}
      CASSANDRA_HOST: ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_DC: ${CASSANDRA_DC:-datacenter1}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      SMTP_URL: ${SMTP_URL:-}
      RESET_PUBLIC_URL: ${RESET_PUBLIC_URL:-}
      RESET_FROM: ${RESET_FROM:-}
      NOTIFICATIONS_TOKEN: ${NOTIFICATIONS_TOKEN:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:-}
      GOOGLE_OIDC_ISSUER: ${GOOGLE_OIDC_ISSUER:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      MICROSOFT_OIDC_ISSUER: ${MICROSOFT_OIDC_ISSUER:-}
      MICROSOFT_OIDC_CLIENT_ID: ${MICROSOFT_OIDC_CLIENT_ID:-}
      MICROSOFT_OIDC_CLIENT_SECRET: ${MICROSOFT_OIDC_CLIENT_SECRET:-}
      DEV_OIDC_ISSUER: ${DEV_OIDC_ISSUER:-}
      DEV_OIDC_CLIENT_ID: ${DEV_OIDC_CLIENT_ID:-}
      DEV_OIDC_CLIENT_SECRET: ${DEV_OIDC_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${CORE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  notify-java:
    build: ../services/notify-java
    profiles: [notifications]
    mem_limit: 320m
    environment:
      JDBC_URL: ${JDBC_URL:-jdbc:postgresql://postgres:5432/motosys}
      JDBC_USER: ${JDBC_USER:-motosys}
      JDBC_PASSWORD: ${POSTGRES_PASSWORD:-}
      MONGO_URL: ${MONGO_URL:-}
      REDIS_URL: ${REDIS_URL:?Define REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      NOTIFICATIONS_TOKEN: ${NOTIFICATIONS_TOKEN:-}
    ports:
      - "127.0.0.1:${NOTIFY_PORT:-3001}:3001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  analytics-python:
    build: ../services/analytics-python
    mem_limit: 256m
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Define REDIS_URL}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  proxy:
    build:
      context: ../clients
      dockerfile: web/Dockerfile
    profiles: [notifications]
    mem_limit: 48m
    ports:
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_DIRECTORY:-./tls}:/etc/motosys/tls:ro
    depends_on:
      core-nestjs:
        condition: service_healthy
      notify-java:
        condition: service_healthy
      analytics-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-alpine
    hostname: motosys-rabbitmq
    profiles: [notifications]
    mem_limit: 256m
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-motosys}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/50-motosys.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
volumes:
  rabbitmq:
networks:
  default:
    external: true
    name: motosys_net
