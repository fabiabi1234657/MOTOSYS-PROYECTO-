pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log off;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 3m;
    server {
        listen 8443 ssl;
        ssl_certificate /etc/motosys/tls/localhost.crt;
        ssl_certificate_key /etc/motosys/tls/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 35s;
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $core http://core-nestjs:3000;
        set $notify http://notify-java:3001;
        set $analytics http://analytics-python:3002;
        location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
        root /usr/share/nginx/html;
        location / { try_files $uri $uri/ /index.html; }
        location = /api/core { return 308 /api/core/openapi.json; }
        location = /api/notify { return 308 /api/notify/v3/api-docs; }
        location = /api/analytics { return 308 /api/analytics/docs; }
        location /api/core/ { rewrite ^/api/core(/.*)$ $1 break; proxy_pass $core; }
        location /auth/oidc/ { proxy_pass $core; }
        location /api/notify/ { rewrite ^/api/notify(/.*)$ $1 break; proxy_pass $notify; }
        location ~ ^/api/analytics/(health|openapi\.json|docs)$ {
            rewrite ^/api/analytics(/.*)$ $1 break; proxy_pass $analytics;
        }
        location /api/analytics/ { rewrite ^/api/analytics(/.*)$ /analytics$1 break; proxy_pass $analytics; }
    }
}
